include "#!./gradlew -q printConveyorConfig"

rust-jar-base = "composeApp/build/libs/musicopy-"${app.version}"-"

app {
  rdns-name = "app.musicopy"
  fsname = "musicopy"
  display-name = "Musicopy"

  vcs-url = "https://github.com/fractalbeauty/musicopy"
  license = "AGPL-3.0-or-later"

  contact-email = "hazel@meows.zip"

  site {
    base-url = "https://download.musicopy.app"

    theme = light

    extra-header-html = """
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=REM:wght@100..900&display=swap">
      <style>
        html:root {
          --backdrop: rgb(249 250 239);
          --foreground: rgb(26 28 22);
          --button-face: rgb(205 237 163);
          --button-text: rgb(53 78 22);
          --pane-color: rgb(238 239 227);
          --no-go-color: rgb(238 239 227);
          --note-text: rgb(68 72 61);
        }
        body {
          font-family: Inter, sans-serif;
          font-optical-sizing: auto;
          font-size: medium;
        }
        .container { min-height: 100vh; }
        .container > div { min-height: 0 !important; }
        #conveyor-logo { position: fixed; right: 0; bottom: 1em; }
        #logo { padding: 0 0 20px !important; }
        #logo img { display: block; width: 128px; height: 128px; border: 1px solid rgb(197 200 186); }
        #panes > div > br { display: none; }
        #version { margin-bottom: 20px !important; }
        .alternative-downloads { padding-top: 20px !important; }
        .alternative-downloads a { padding-top: 0 !important; }
        #title {
          font-family: REM, sans-serif;
          font-optical-sizing: auto;
          font-weight: 700;
          font-size: 28px;
          margin: 0 0 4px;
          text-transform: uppercase;
        }
        #version { color: rgb(117 121 108); }
        .pane {
          background-color: transparent !important;
          border: none;
          padding: 20px !important;
          box-shadow: none !important;
        }
        .download-button {
          letter-spacing: normal !important;
          padding: 20px 32px !important;
          width: 20em !important;
          font-size: 16px;
          text-transform: none !important;
          font-weight: 500;
          border: 1px solid rgb(197 200 186);
        }
        #pane-mac .download-button { display: flex; margin-left: auto; margin-right: auto; }
        #mac-amd64 { margin-bottom: 12px; }
        .download-button > svg { width: 1.25em; height: 1.25em; padding-right: 0.75em !important; }
        .download-button:hover { filter: brightness(0.97); }
        .smaller-fonts, .smaller-fonts a { color: rgb(68 72 61); font-size: medium; }
        .smaller-fonts a, .note a { color: rgb(56 102 99); }
        .alternative-downloads, .alternative-downloads a { color: rgb(117 121 108); }
        .terminal { background-color: rgb(47 49 42); border-radius: 0; }
        .terminal .tooltip { border-bottom: none; }
        .terminal .copy-button { width: 20px; height: 20px; padding-left: 16px; }
      </style>
    """
  }

  machines = ["linux.amd64.glibc", "mac.amd64", "mac.aarch64", "windows.amd64"]

  linux.amd64.glibc.inputs += ${rust-jar-base}"linux-x86-64.jar"
  mac.amd64.inputs += ${rust-jar-base}"darwin-x86-64.jar"
  mac.aarch64.inputs += ${rust-jar-base}"darwin-aarch64.jar"
  windows.amd64.inputs += ${rust-jar-base}"win32-x86-64.jar"

  icons = "web/public/static/icon.svg"

  # Compose extracts and loads `libskiko.dylib` which can have mismatched signatures
  # which crashes the app so we need to disable library validation.
  mac.entitlements-plist {
    "com.apple.security.cs.disable-library-validation" = true
  }
}

conveyor.compatibility-level = 19
